<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0a152f"/>
      <stop offset="70%" stopColor="#030816"/>
      <stop offset="100%" stopColor="#01040a"/>
    </radialGradient>
    <linearGradient id="visorReflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8"/>
      <stop offset="35%" stopColor="#818cf8" stopOpacity="0.6"/>
      <stop offset="70%" stopColor="#f59e0b" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.9"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="50%" stopColor="#a855f7"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>

  <!-- Orbital HUD Ring -->
  <circle cx="200" cy="200" r="190" stroke="url(#glowRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="182" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Telemetry Coordinates Ticks -->
  <path d="M200 10 L200 24 M200 376 L200 390 M10 200 L24 200 M376 200 L390 200" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <path d="M66 66 L78 78 M334 66 L322 78 M66 334 L78 322 M334 334 L322 322" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Astronaut Suit Torso & Shoulders -->
  <path d="M70 380 C70 300 120 270 200 270 C280 270 330 300 330 380 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Suit Collar / Seal Ring -->
  <ellipse cx="200" cy="272" rx="72" ry="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Chest Control Panel -->
  <rect x="175" y="315" width="50" height="34" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="188" cy="328" r="4" fill="#10b981"/>
  <circle cx="200" cy="328" r="4" fill="#38bdf8"/>
  <circle cx="212" cy="328" r="4" fill="#f59e0b"/>
  <rect x="184" y="338" width="32" height="3" rx="1.5" fill="#64748b"/>

  <!-- Astronaut Helmet Outer Sphere -->
  <circle cx="200" cy="170" r="88" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="200" cy="170" r="84" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Helmet Visor Frame -->
  <ellipse cx="200" cy="168" rx="66" ry="52" fill="#050814" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Visor Gold/Cyan Chromatic Reflection -->
  <ellipse cx="200" cy="168" rx="62" ry="48" fill="url(#visorReflect)"/>

  <!-- Visor Specular Reflection Curve -->
  <path d="M152 142 Q 175 128 205 130" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M158 149 Q 180 137 215 139" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Helmet Side Lights / Communications Earpieces -->
  <rect x="104" y="156" width="10" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="109" cy="168" r="2.5" fill="#38bdf8"/>
  <rect x="286" y="156" width="10" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="291" cy="168" r="2.5" fill="#38bdf8"/>

  <!-- Mission Callsign Text Stamp -->
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" letter-spacing="3" opacity="0.8">SD-01 // OPERATOR</text>
</svg>
